name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out NullFrame Core
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The normal build packages the native binaries that are already in
      # src/main/resources/native. It does not rebuild them and does not need CMake.
      - name: Build NullFrame Core
        run: |
          chmod +x gradlew
          ./gradlew build

      - name: Upload NullFrame Core jar
        uses: actions/upload-artifact@v4
        with:
          name: nullframe-core
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
